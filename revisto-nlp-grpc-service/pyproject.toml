[tool.poetry]
name = "revisto-nlp-grpc-service"
version = "0.1.0"
description = "gRPC service for NLP operations (embedding and NER)"
authors = ["Revisto"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
grpcio = ">=1.62.0"
grpcio-tools = ">=1.62.0"
grpcio-health-checking = ">=1.62.0"
protobuf = ">=5.26.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
boto3 = "^1.34.0"
loguru = "^0.7.2"
sentence-transformers = "^2.2.0"
transformers = "^4.36.0"
torch = "^2.1.0"
numpy = "^1.26.0"
stanza = "==1.11.0"
mypy-protobuf = "^3.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.12.0"
isort = "^5.13.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120
