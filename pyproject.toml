[tool.poetry]
name = "revisto-evidence-aligned"
version = "0.3.0"
description = "API service for evidence alignment and claim extraction"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "revisto_evidence_aligned"}]

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "==0.104.1"
uvicorn = {extras = ["standard"], version = "==0.24.0.post1"}
pydantic = ">=2.6.0,<2.10.0"
pydantic-settings = "*"

elasticsearch = "==8.19.0"
sentence-transformers = "==4.1.0"
transformers = "==4.51.3"
torch = {version = "==2.8.0+cpu", source = "pytorch_cpu"}
numpy = "<=2.2.6"
python-multipart = "==0.0.12"
httpx = "==0.27.2"
prometheus-fastapi-instrumentator = "==6.1.0"
typing-extensions = ">=4.0.0"
boto3 = "^1.35.36"
openai = "^1.0.0"
anthropic = "^0.40.0"
Levenshtein = "==0.26.1"
pymupdf = "==1.23.22"
stanza = "==1.11.0"
scispacy = "==0.6.2"
openpyxl = "^3.1.0"
grpcio = ">=1.60.0"
grpcio-tools = ">=1.60.0"
beautifulsoup4 = "^4.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.10.0"
mypy = "^1.6.0"
ruff = "^0.1.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
