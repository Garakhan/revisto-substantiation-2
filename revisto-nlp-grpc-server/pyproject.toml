[tool.poetry]
name = "revisto_nlp_grpc_service"
version = "0.1.0"
description = ""
authors = ["Revisto"]
packages = [
    { include = "**/*.py", from = "generated", to = "revisto_nlp_grpc_service" }
]
readme = "README.md"

# For forward-compatibility:
# Reference: Warning: In a future version of Poetry, PyPI will be disabled automatically if at least one custom primary
#source is configured. In order to avoid a breaking change and make your pyproject.toml forward compatible,
#add PyPI explicitly via 'poetry source add pypi'. By the way, this has the advantage that you can set the priority
#of PyPI as with any other source.
[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
# proto
python = ">=3.11,<3.13"
betterproto2 = "^0.9.1"
betterproto2-compiler = "^0.9.0"
grpcio-tools = "^1.76.0"
mypy-protobuf = "^3.7.0"
loguru = "^0.7.2"
ddtrace = "2.21.12"
grpclib = "^0.4.8"
grpcio-health-checking = "^1.76.0"
pydantic-settings = "^2.5.2"
boto3 = "^1.35.36"

#logic
sentence-transformers = "^2.2.0"
transformers = "^4.36.0"
torch = { version = "^2.1.0", source = "pytorch_cpu" }
stanza = "==1.11.0"
numpy = "^1.26.0"
spacy = "==3.7.5"
ipykernel = "^7.2.0"
gliner = "==0.2.26"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-cov = "^5.0.0"
pytest-asyncio = "^1.3.0"
pre-commit = "^4.0.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
